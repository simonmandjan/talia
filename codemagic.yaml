workflows:
  android-release:
    name: Android Release (manual)
    max_build_duration: 60
    environment:
      android_signing:
        - talia_rider_release_keystore
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up Firebase config
        script: |
          echo $GOOGLE_SERVICES_JSON_BASE64 | base64 --decode > android/app/google-services.json
      - name: Set up key.properties from Codemagic-managed keystore
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/mapping.txt

  # Builds an UNSIGNED archive only, to prove the iOS toolchain works.
  # Do not enable real signing / app_store_connect publishing here until
  # the Apple Developer account exists — see docs/superpowers/specs/2026-08-15-app-publishing-pipeline-design.md.
  ios-release:
    name: iOS Release (manual, unsigned — prep only)
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build unsigned iOS archive
        script: flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/archive/*.xcarchive
