workflows:
  android-release:
    name: Android Release (manual)
    max_build_duration: 60
    environment:
      android_signing:
        - talia_rider_release_keystore
      groups:
        - secrets
      vars:
        # R8 (minifyEnabled true for this app) runs out of heap on the default
        # 8GB build machine without this - see docs.codemagic.io/troubleshooting/common-android-issues
        JAVA_TOOL_OPTIONS: "-Xmx5g"
      flutter: 3.32.7
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up Firebase config
        script: |
          echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/google-services.json
          python3 -c "import json; json.load(open('android/app/google-services.json'))" || (echo "ERROR: GOOGLE_SERVICES_JSON_BASE64 did not decode to valid JSON - check the Codemagic variable value" && exit 1)
      - name: Set up key.properties from Codemagic-managed keystore
        script: |
          cat > android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=$CM_KEYSTORE_PATH
          EOF
      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release \
            --dart-define=ONESIGNAL_REST_KEY_DRIVER=$ONESIGNAL_REST_KEY_DRIVER \
            --dart-define=ONESIGNAL_REST_KEY_RIDER=$ONESIGNAL_REST_KEY_RIDER
      - name: Build Android APK
        script: |
          flutter build apk --release \
            --dart-define=ONESIGNAL_REST_KEY_DRIVER=$ONESIGNAL_REST_KEY_DRIVER \
            --dart-define=ONESIGNAL_REST_KEY_RIDER=$ONESIGNAL_REST_KEY_RIDER
    artifacts:
      - build/app/outputs/**/*.aab
      - build/app/outputs/**/*.apk
      - build/app/outputs/**/mapping.txt

  # Builds an UNSIGNED archive only, to prove the iOS toolchain works.
  # Signed App Store build, uploaded to TestFlight (no automatic App Store review submission).
  # One-time setup in Codemagic before the first run:
  #   1. Teams > Integrations > Apple Developer Portal: add an App Store Connect API key named "talia_asc".
  #   2. Group "secrets": add CERTIFICATE_PRIVATE_KEY (RSA private key, PEM, used to create the
  #      distribution certificate) and GOOGLE_SERVICE_INFO_PLIST_RIDER_BASE64 (base64 of this app's GoogleService-Info.plist).
  #   3. Both bundle IDs (app + OneSignal notification extension) registered in the Apple account,
  #      app record created in App Store Connect.
  ios-release:
    name: iOS Release (App Store / TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: talia_asc
    environment:
      groups:
        - secrets
      vars:
        BUNDLE_ID: "com.talia.taxi"
        EXTENSION_BUNDLE_ID: "com.talia.taxi.OneSignalNotificationServiceExtension"
      flutter: 3.32.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Set up Firebase iOS config
        script: |
          echo "$GOOGLE_SERVICE_INFO_PLIST_RIDER_BASE64" | tr -d '[:space:]' | base64 --decode > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist || (echo "ERROR: GOOGLE_SERVICE_INFO_PLIST_RIDER_BASE64 did not decode to a valid plist - check the Codemagic variable value" && exit 1)
      - name: Install CocoaPods dependencies
        script: cd ios && pod install
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$EXTENSION_BUNDLE_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Set build number
        script: sed -i '' -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/" ios/Runner.xcodeproj/project.pbxproj
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=ONESIGNAL_REST_KEY_DRIVER=$ONESIGNAL_REST_KEY_DRIVER \
            --dart-define=ONESIGNAL_REST_KEY_RIDER=$ONESIGNAL_REST_KEY_RIDER
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
